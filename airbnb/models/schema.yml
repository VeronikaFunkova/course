models:
  - name: dim_listings_cleansed
    description: Cleansed table which contains Airbnb listings.
    data_tests:
      - minimum_row_count:
          arguments:
            min_row_count: 1000
          severity: warn

    columns:
      - name: listing_id
        description: Primary key for the listing.
        data_tests:
          - unique
          - not_null

      - name: host_id
        description: The host's id. References the host table.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_hosts_cleansed')
                field: host_id

      - name: room_type
        description: Type of the apartment / room
        data_tests:
          - accepted_values:
              arguments:
                values: ['Entire home/apt',
                            'Private room',
                            'Shared room',
                            'Hotel room']
              severity: warn

      - name: minimum_nights
        description: '{{ doc("dim_listing_cleansed__minimum_nights") }}'
        data_tests:
          - positive_values
            


  - name: dim_hosts_cleansed
    versions:
      - v: 1
        defined_in: dim_hosts_cleansed
        deprecation_date: 2030-01-01
      - v: 2
        columns:
          - include: '*'
            exclude: [host_name]
          - name: host_name
            description: The name of the host (N/A if not available)
            data_type: string
            constraints:
              - type: not_null
    latest_version: 2

    config:
      contract:
        enforced: true

    description: Cleansed table which contains Airbnb hosts.

    columns:
      - name: host_id
        data_type: integer
        description: Primary key for the host. Referenced by host_id in dim_listings_cleansed.
        constraints:
          - type: not_null
        data_tests:
          - unique
        #  - not_null

      - name: host_name
        data_type: string
        description: The host's name. If it's missing, we record it as Anonymous.
        constraints:
          - type: not_null
        #data_tests:     # už ich nepotrebujeme, lebo máme constrains
        #  - not_null

      - name: is_superhost
        data_type: string
        description: The host's status (t - is a superhost, f - is not a superhost).
        data_tests:
          - accepted_values:
              arguments:
                values: ['t', 'f']

      - name: updated_at
        description: Time of the last update of the host's record.
        data_type: timestamp

      - name: created_at
        description: Time when the host's record was created.
        data_type: timestamp


  - name: dim_listings_w_hosts
    data_tests:
      - dbt_expectations.expect_table_row_count_to_equal_other_table:
          arguments:
            compare_model: source('airbnb', 'listings')
    columns:
      - name: price
        data_tests:
        - dbt_expectations.expect_column_values_to_be_of_type:
            arguments:
              column_type: number
        - dbt_expectations.expect_column_quantile_values_to_be_between:
            arguments:
              quantile: .99
              min_value: 50
              max_value: 500
        - dbt_expectations.expect_column_max_to_be_between:
            arguments:
              max_value: 5000
            config:
              severity: warn




  - name: fct_reviews
    columns:
      - name: listing_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_listings_cleansed')
                field: listing_id

      - name: reviewer_name
        data_tests:
          - not_null

      - name: review_sentiment
        data_tests:
          - accepted_values:
              arguments:
                values: ['positive', 'neutral', 'negative']

  




